<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Loy Ot app icon</title>
<desc>Square app icon: black L and O monogram with gold accent on white background.</desc>

<rect width="512" height="512" rx="96" fill="#ffffff"/>

<g transform="translate(256,256)">
  <circle cx="0" cy="0" r="122" fill="none" stroke="#b8975a" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="102" fill="none" stroke="#0a0a0a" stroke-width="17"/>

  <!-- white halo separates the L cleanly from the ring beneath it -->
  <path d="M -80 -30 L -80 74 L 44 74"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter"/>

  <path d="M -80 -30 L -80 74 L 44 74"
        fill="none" stroke="#0a0a0a" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>

  <line x1="-26" y1="-96" x2="26" y2="-58" stroke="#b8975a" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
