<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Loy Ot logo</title>
<desc>Minimalist black and white L and O monogram with gold accent ring, and the wordmark Loy Ot below in modern letterspaced sans-serif type.</desc>

<rect width="800" height="1000" fill="#ffffff"/>

<g transform="translate(400,360) scale(1.7)">
  <circle cx="0" cy="0" r="122" fill="none" stroke="#b8975a" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="102" fill="none" stroke="#0a0a0a" stroke-width="17"/>

  <path d="M -80 -30 L -80 74 L 44 74"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M -80 -30 L -80 74 L 44 74"
        fill="none" stroke="#0a0a0a" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>

  <line x1="-26" y1="-96" x2="26" y2="-58" stroke="#b8975a" stroke-width="3" stroke-linecap="round"/>
</g>

<text x="400" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="10" fill="#0a0a0a">LOY OT</text>

<line x1="330" y1="732" x2="470" y2="732" stroke="#b8975a" stroke-width="2"/>

<text x="400" y="770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#6b6b6b">FASHION &amp; STYLE</text>

</svg>
