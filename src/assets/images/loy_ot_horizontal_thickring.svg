<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Loy Ot horizontal logo</title>
<desc>Horizontal logo lockup using the thick-ring L and O monogram with gold accent, wordmark and tagline in a row to the right, on a white background.</desc>

<rect width="640" height="300" fill="#ffffff"/>

<g transform="translate(170,150) scale(0.78)">
  <circle cx="0" cy="0" r="122" fill="none" stroke="#b8975a" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="102" fill="none" stroke="#0a0a0a" stroke-width="17"/>

  <path d="M -80 -30 L -80 74 L 44 74"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M -80 -30 L -80 74 L 44 74"
        fill="none" stroke="#0a0a0a" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>

  <line x1="-26" y1="-96" x2="26" y2="-58" stroke="#b8975a" stroke-width="3" stroke-linecap="round"/>
</g>

<line x1="290" y1="80" x2="290" y2="220" stroke="#d9d2c4" stroke-width="1.5"/>

<text x="330" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="600" letter-spacing="9" fill="#0a0a0a">LOY OT</text>
<text x="330" y="192" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="5" fill="#8a8a8a">FASHION &amp; STYLE</text>

</svg>
